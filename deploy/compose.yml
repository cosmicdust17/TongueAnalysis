services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tongue_analysis
      MYSQL_USER: tongue_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python scripts/configure.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python scripts/configure.py first}
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run python scripts/configure.py first}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 8s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: mysql+pymysql://tongue_app:${MYSQL_PASSWORD}@mysql:3306/tongue_analysis?charset=utf8mb4
      GRAPH_PROVIDER: neo4j
      NEO4J_URI: bolt://neo4j:7687
      STORAGE_PATH: /data/storage
      AUTO_CREATE_SCHEMA: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mysql_data:
  neo4j_data:
